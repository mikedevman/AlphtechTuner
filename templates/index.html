<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphtechTuner - Audio Chromatic Tuner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <span class="logo-dot"></span>
                <h1>Alphtech<span>Tuner</span></h1>
            </div>
        </header>

        <!-- Main Tuner Card -->
        <main class="tuner-card">
            <!-- Tuner Pitch Display -->
            <div class="pitch-display">
                <div class="note-container">
                    <span id="detected-note" class="note-name">--</span>
                    <span id="detected-octave" class="note-octave"></span>
                </div>
                <div class="freq-readout">
                    <span id="detected-freq">0.0</span> <span class="unit">Hz</span>
                </div>
                <div id="tuning-badge" class="tuning-badge status-idle">Ready</div>
            </div>

            <!-- Gauge / Needle Meter -->
            <div class="meter-wrapper">
                <div class="meter-scale">
                    <span>-50</span>
                    <span>-30</span>
                    <span>-15</span>
                    <span class="center-mark">0</span>
                    <span>+15</span>
                    <span>+30</span>
                    <span>+50</span>
                </div>
                <div class="meter-track">
                    <div class="in-tune-zone"></div>
                    <div id="needle" class="meter-needle" style="left: 50%;"></div>
                </div>
                <div class="cents-readout">
                    <span id="cents-value">0</span> <span class="unit">cents</span>
                </div>
            </div>

            <!-- Microphone Controls -->
            <div class="actions">
                <button id="btn-listen" class="btn btn-primary">
                    <span class="icon">&#9654;</span> Start Microphone
                </button>
            </div>

            <!-- Concert Pitch Calibration -->
            <div class="calibration-panel">
                <label for="concert-pitch-slider">
                    Concert Pitch Reference (A4): <strong id="concert-pitch-val">440.0</strong> Hz
                </label>
                <div class="slider-row">
                    <span>415 Hz</span>
                    <input type="range" id="concert-pitch-slider" min="415" max="466" value="440" step="0.5">
                    <span>466 Hz</span>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/tuner.js') }}"></script>
</body>
</html>
